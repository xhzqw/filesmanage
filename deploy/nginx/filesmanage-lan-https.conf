# filesmanage development ONLY: LAN/VPN HTTPS, not the production 443/8091 sites.
# Installed by scripts/setup-lan-https.sh. The CA private key is root-only.
map $http_upgrade $filesmanage_upgrade_connection {
    default upgrade;
    ''      close;
}

# Cookies ignore TCP ports. Strip the document-app session cookie before
# proxying to ONLYOFFICE, without discarding editor-specific cookies.
map $http_cookie $filesmanage_office_cookies {
    default $http_cookie;
    "~^fm_session=[^;]*(?:;[ ]*)?(?<office_tail>.*)$" $office_tail;
    "~^(?<office_head>.*?);[ ]*fm_session=[^;]*(?<office_rest>.*)$" "$office_head$office_rest";
}

server {
    listen 192.168.1.22:18443 ssl;
    listen 10.144.144.1:18443 ssl;
    server_name 192.168.1.22 10.144.144.1 openclaw77;
    ssl_certificate     /root/repository77/filesmanage-v21/.secrets/lan-tls/server.crt;
    ssl_certificate_key /root/repository77/filesmanage-v21/.secrets/lan-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    allow 127.0.0.1;
    allow 192.168.1.0/24;
    allow 10.144.144.0/24;
    deny all;

    client_max_body_size 0;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite client input: the Go rate limiter trusts this header only
        # when the TCP peer is loopback and the proxy uses HTTPS.
        proxy_set_header X-Filesmanage-Client-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $filesmanage_upgrade_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        # A TLS request may never receive a downgradable session cookie.
        proxy_cookie_flags fm_session secure httponly samesite=strict;
    }
}

# ONLYOFFICE is served from a dedicated HTTPS origin so its absolute asset
# and websocket URLs work. Internal editor callbacks remain on HTTP LAN.
server {
    listen 192.168.1.22:18444 ssl;
    listen 10.144.144.1:18444 ssl;
    server_name 192.168.1.22 10.144.144.1 openclaw77;
    ssl_certificate     /root/repository77/filesmanage-v21/.secrets/lan-tls/server.crt;
    ssl_certificate_key /root/repository77/filesmanage-v21/.secrets/lan-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    allow 127.0.0.1;
    allow 192.168.1.0/24;
    allow 10.144.144.0/24;
    deny all;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $filesmanage_upgrade_connection;
        proxy_buffering off;
        proxy_set_header Cookie $filesmanage_office_cookies;
    }
}
