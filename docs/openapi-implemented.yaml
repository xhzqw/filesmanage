              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grant'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Grant actions to a subject
      operationId: createGrant
      tags:
      - Grants
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Grant'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/acls/{id}:
    delete:
      summary: Revoke a grant
      operationId: revokeGrant
      tags:
      - Grants
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Grant id.
        schema:
          type: string
      responses:
        '200':
          description: Revoked grant id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      revoked:
                        type: string
                    required:
                    - revoked
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/files:
    post:
      summary: Upload a file (multipart, idempotent)
      operationId: uploadFile
      tags:
      - Files
      security:
      - cookieSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File content.
                folderId:
                  type: string
                  description: Destination folder id.
                idempotencyKey:
                  type: string
                  description: Replay-safe upload key.
              required:
              - file
              - folderId
      responses:
        '201':
          description: Committed (or deduplicated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      fileId:
                        type: string
                      versionSeq:
                        type: integer
                      sha256:
                        type: string
                      size:
                        type: integer
                      name:
                        type: string
                      folderId:
                        type: string
                      deduplicated:
                        type: boolean
                    required:
                    - fileId
                    - versionSeq
                    - sha256
                    - size
                    - name
                    - folderId
                    - deduplicated
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: E_TOO_LARGE — body exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List files in a folder (keyset pagination)
      operationId: listFiles
      tags:
      - Files
      security:
      - cookieSession: []
      parameters:
      - name: folder
        in: query
        required: true
        description: Folder id; empty lists across authorized scope.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size (clamped server-side).
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: sort
        in: query
        required: false
        description: Sort key.
        schema:
          type: string
          enum:
          - name
          - size
          - updated
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor from nextCursor.
        schema:
          type: string
      responses:
        '200':
          description: Authorized file page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/FilePage'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: Rejected with 403 E_PASSWORD_CHANGE_REQUIRED until the forced first-login password change completes.
  /api/files/{id}:
    get:
      summary: File metadata with version history
      operationId: fileMeta
      tags:
