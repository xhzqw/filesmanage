  /api/workbench/paper-copies/{id}/events:
    post:
      summary: Append per-copy physical collection, loss or destruction evidence with CAS; no implicit electronic reading
        credit
      operationId: cdwPaperEvent
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Numbered physical copy ID
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: 8-128 ASCII letters, digits, hyphens or underscores; same key+body exactly replays the committed result.
        schema:
          type: string
          maxLength: 128
      - name: If-Match
        in: header
        required: true
        description: Strong ETag rev-N enclosed in double quotes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - collected
                  - lost
                  - destroyed
                reason:
                  type: string
                  minLength: 12
                  maxLength: 2000
              required:
              - kind
              - reason
      responses:
        '200':
          description: Immutable per-copy event and updated state pointer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      copyId:
                        type: string
                      eventId:
                        type: string
                      kind:
                        type: string
                        enum:
                        - collected
                        - lost
                        - destroyed
                      state:
                        type: string
                        enum:
                        - collected
                        - lost
                        - destroyed
                      revision:
                        type: integer
                        minimum: 2
                      actorId:
                        type: string
                      reason:
                        type: string
                    required:
                    - copyId
                    - eventId
                    - kind
                    - state
                    - revision
                    - actorId
                    - reason
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
