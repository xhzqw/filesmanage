        description: Sort key (search/stats/export accept only these; anything else is 400 E_BAD).
        schema:
          type: string
          enum:
          - updated_desc
          - name_asc
          - size_desc
      - name: limit
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: from
        in: query
        required: false
        description: Lower bound on updatedAt (RFC3339).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Upper bound on updatedAt (RFC3339).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Counts by type, month and uploader.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Stats'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/exports/files.csv:
    get:
      summary: Stream authorized CSV export
      operationId: exportFiles
      tags:
      - Search
      security:
      - cookieSession: []
      parameters:
      - name: q
        in: query
        required: false
        description: Search query; CJK text is tokenized per character.
        schema:
          type: string
      - name: folder
        in: query
        required: false
        description: Restrict to one authorized folder.
        schema:
          type: string
      - name: scope
        in: query
        required: false
        description: descendants includes child folders.
        schema:
          type: string
          enum:
          - ''
          - descendants
      - name: uploader
        in: query
        required: false
        description: Filter by uploader id.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Filter by content-type prefix.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Sort key (search/stats/export accept only these; anything else is 400 E_BAD).
        schema:
          type: string
          enum:
          - updated_desc
          - name_asc
          - size_desc
      - name: limit
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: from
        in: query
        required: false
        description: Lower bound on updatedAt (RFC3339).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Upper bound on updatedAt (RFC3339).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: UTF-8 CSV with BOM; rows stream as the scan progresses.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="files.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/trash:
    get:
      summary: List trash entries visible to the caller
      operationId: listTrash
      tags:
      - Trash
      security:
      - cookieSession: []
      parameters:
      - name: search
        in: query
        required: false
        description: Case-insensitive literal substring of the original name (max 120 characters).
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Resource kind.
        schema:
          type: string
          enum:
          - all
          - file
          - folder
      - name: deletedBy
        in: query
        required: false
        description: Case-insensitive fragment of the deleter display name or login (max 80 characters).
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Deletion timestamp lower bound (RFC3339).
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        required: false
        description: Deletion order.
        schema:
          type: string
          enum:
          - recent
          - oldest
          - name
      - name: offset
        in: query
        required: false
        description: Offset into filtered visible records.
        schema:
          type: integer
          minimum: 0
          maximum: 100000
      - name: limit
        in: query
        required: false
        description: Page size (defaults to 40 with a query string).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Legacy array without query string; filtered page when query parameters are supplied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    oneOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/TrashEntry'
                    - type: object
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/TrashEntry'
                        hasMore:
                          type: boolean
                      required:
                      - items
                      - hasMore
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/trash/{id}/restore:
    post:
      summary: Restore a trash entry
      operationId: restoreTrash
      tags:
      - Trash
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Trash entry id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreTrashRequest'
      responses:
        '200':
          description: Restored entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/TrashEntry'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/trash/{id}:
    delete:
      summary: Permanently purge a trash entry
      operationId: purgeTrash
      tags:
      - Trash
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Trash entry id.
        schema:
          type: string
      responses:
        '200':
          description: Purged trash id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      purged:
                        type: string
                    required:
                    - purged
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: fm_session
      description: HttpOnly session cookie issued by POST /api/login.
    officeJWT:
      type: http
      scheme: bearer
      description: Document-server JWT presented by ONLYOFFICE on save callbacks.
    officeSourceToken:
      type: apiKey
      in: query
      name: token
      description: Per-session source token embedded in the editor document URL.
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable SPEC 5.3 error code.
            message:
              type: string
              description: Present when the server attaches a deliberate public message (e.g. the batch-move limit) or when
                FILESMANAGE_DEBUG_ERRORS=true.
          required:
          - code
      required:
      - ok
      - error
    SessionUser:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          description: Deprecated compatibility field; always false for active accounts.
      required:
      - id
      - displayName
      - isAdmin
      - mustChangePassword
    User:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        departmentId:
          type: string
        mustChangePassword:
          type: boolean
        disabled:
          type: boolean
      required:
      - id
      - login
      - displayName
      - isAdmin
      - departmentId
      - mustChangePassword
      - disabled
    Department:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
      required:
      - id
      - name
      - parentId
    Workgroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        departmentId:
          type: string
      required:
      - id
      - name
      - departmentId
    Folder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
      required:
      - id
      - name
      - parentId
    FolderChildrenItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
          description: Null for a visible root, including a pruned subtree whose real parent the caller may not list.
        hasChildren:
          type: boolean
          description: True when at least one child folder is listable by the caller; probed server-side with EXISTS, never
            by loading the children.
        canSelect:
          type: boolean
          description: 'UI hint only: the caller holds upload on the folder, so it can be a move/upload target. The transaction
            that consumes the selection re-verifies.'
        disabledReason:
          type: string
          description: Present only when canSelect is false; a short public reason that never explains visibility.
      required:
      - id
      - name
      - parentId
      - hasChildren
      - canSelect
    FolderSearchItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
          description: Null for a visible root, including a pruned subtree whose real parent the caller may not list.
        hasChildren:
          type: boolean
          description: True when at least one child folder is listable by the caller; probed server-side with EXISTS, never
            by loading the children.
        canSelect:
          type: boolean
          description: 'UI hint only: the caller holds upload on the folder, so it can be a move/upload target. The transaction
            that consumes the selection re-verifies.'
        disabledReason:
          type: string
          description: Present only when canSelect is false; a short public reason that never explains visibility.
        path:
          type: string
          description: Listable ancestor names joined with " / ", truncated at the first ancestor the caller may not list;
            an orphaned subtree shows its own name only.
      required:
      - id
      - name
      - parentId
      - hasChildren
      - canSelect
      - path
    FolderChildrenPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FolderChildrenItem'
        nextCursor:
          type: string
          description: Opaque keyset cursor over (name,id); empty on the last page.
      required:
      - items
      - nextCursor
    FolderSearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FolderSearchItem'
        nextCursor:
          type: string
          description: Opaque keyset cursor over (name,id); empty on the last page.
      required:
      - items
      - nextCursor
    File:
      type: object
      properties:
        id:
          type: string
        folderId:
          type: string
        name:
          type: string
        uploadedBy:
          type: string
          description: Uploader display name.
        contentType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the committed content.
        updatedAt:
          type: string
          format: date-time
        currentVersionSeq:
          type: integer
          description: Absent when the file has no committed version.
      required:
      - id
      - folderId
      - name
      - uploadedBy
      - contentType
      - sizeBytes
      - sha256
      - updatedAt
    FileVersion:
      type: object
      properties:
        versionSeq:
          type: integer
          description: Monotonic per file; rollback appends a new version.
        sha256:
          type: string
        sizeBytes:
          type: integer
        action:
          type: string
          enum:
          - upload
          - save
          - rollback
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        baseSeq:
          type: integer
          description: Version this change was based on.
        rollbackTargetSeq:
          type: integer
          description: Present for rollback versions.
        rollbackFromSeq:
          type: integer
          description: Present for rollback versions.
        reason:
          type: string
      required:
      - versionSeq
      - sha256
      - sizeBytes
      - action
      - createdBy
      - createdAt
    FileBusinessMetadata:
      type: object
      properties:
        fileId:
          type: string
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - fileId
      - category
      - description
      - tags
      - updatedBy
      - updatedAt
    UpdateFileBusinessMetadata:
      type: object
      properties:
        category:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        tags:
          type: array
          items:
            type: string
      required:
      - category
      - description
      - tags
    VersionComparisonLine:
      type: object
      properties:
        kind:
          type: string
          enum:
          - equal
          - added
          - removed
        left:
          type: integer
        right:
          type: integer
        text:
          type: string
      required:
      - kind
      - text
    VersionCompareInfo:
      type: object
      properties:
        seq:
          type: integer
        sha256:
          type: string
        sizeBytes:
          type: integer
      required:
      - seq
      - sha256
      - sizeBytes
    OfficeSemanticChange:
      type: object
      properties:
        kind:
          type: string
          enum:
          - added
          - removed
          - changed
        section:
          type: string
        key:
          type: string
        before:
          type: string
        after:
          type: string
      required:
      - kind
      - section
      - key
      - before
      - after
    VersionComparison:
      type: object
      properties:
        left:
          $ref: '#/components/schemas/VersionCompareInfo'
        right:
          $ref: '#/components/schemas/VersionCompareInfo'
        mode:
          type: string
          enum:
          - identical
          - metadata
          - large
          - text
        detail:
          type: string
          enum:
          - office_parts
          - office_semantic
        semanticChanges:
          type: array
          items:
            $ref: '#/components/schemas/OfficeSemanticChange'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/VersionComparisonLine'
        added:
          type: integer
        removed:
          type: integer
      required:
      - left
      - right
      - mode
      - lines
      - added
      - removed
    ReviewComment:
      type: object
      properties:
        id:
          type: integer
        fileId:
          type: string
        versionSeq:
          type: integer
        lineNumber:
          type: integer
        body:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
      required:
      - id
      - fileId
      - versionSeq
      - body
      - authorId
      - createdAt
    ReviewCommentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
    CreateReviewComment:
      type: object
      properties:
        version:
          type: integer
        lineNumber:
          type: integer
        body:
          type: string
          maxLength: 2000
      required:
      - version
      - body
    ResumableStatus:
      type: object
      properties:
        id:
          type: string
        received:
          type: integer
        size:
          type: integer
        state:
          type: string
          enum:
          - open
          - committed
          - cancelled
        expiresAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            fileId:
              type: string
            versionSeq:
              type: integer
            sha256:
              type: string
            size:
              type: integer
            name:
              type: string
            folderId:
              type: string
            dedup:
              type: boolean
      required:
      - id
      - received
      - size
      - state
      - expiresAt
    ResumableStart:
      type: object
      properties:
        folderId:
          type: string
        name:
          type: string
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
        idempotencyKey:
          type: string
        sha256:
          type: string
      required:
      - folderId
      - name
      - size
      - idempotencyKey
    FileMeta:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/File'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
      required:
      - file
      - versions
    FilePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
        nextCursor:
          type: string
          description: Opaque keyset cursor; empty when the page is the last one.
      required:
      - items
      - nextCursor
    Grant:
      type: object
      properties:
        id:
          type: string
        folderId:
          type: string
        subjectKind:
          type: string
          enum:
          - user
          - group
        subjectId:
          type: string
        actions:
          type: array
          items:
            type: string
            enum:
            - list
            - preview
            - upload
            - download
            - modify
            - delete
            - rename
            - move
            - print
        scopeOnly:
          type: boolean
          description: When true the grant does not inherit into child folders.
        grantedBy:
          type: string
        grantedByName:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - folderId
      - subjectKind
      - subjectId
      - actions
      - scopeOnly
      - grantedBy
      - grantedByName
    TrashEntry:
      type: object
      properties:
        id:
          type: string
        oldName:
          type: string
        deletedBy:
          type: string
        deletedByName:
          type: string
        deletedAt:
          type: string
          format: date-time
        fileId:
          type: string
          description: Set for deleted files.
        folderId:
          type: string
          description: Set for deleted folders.
        oldParentId:
          type: string
          description: Original parent folder id.
        oldParentPath:
          type: string
          description: Deletion-time folder path, shown only to the deleting actor when a snapshot exists.
        oldParentTrail:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
            - id
            - name
          description: Deletion-time ancestor identities and names; absent for legacy rows or other viewers.
        subtreeCount:
          type: integer
          description: Folders swept into the trash entry.
      required:
      - id
      - oldName
      - deletedBy
      - deletedByName
      - deletedAt
    ApprovalEvent:
      type: object
      properties:
        id:
          type: integer
        approvalId:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        kind:
          type: string
          enum:
          - submitted
          - advanced
          - approved
          - rejected
          - cancelled
          - conflicted
        stepIndex:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - approvalId
      - actorId
      - actorName
      - kind
      - stepIndex
      - comment
      - createdAt
    ApprovalNotification:
      type: object
      properties:
        id:
          type: integer
        approvalId:
          type: string
        fileName:
          type: string
        kind:
          type: string
          enum:
          - submitted
          - advanced
          - approved
          - rejected
          - cancelled
          - conflicted
        stepIndex:
          type: integer
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
      required:
      - id
      - approvalId
      - fileName
      - kind
      - stepIndex
      - createdAt
      - read
    Approval:
      type: object
      properties:
        id:
          type: string
        fileId:
          type: string
        fileName:
          type: string
        requesterId:
          type: string
        requesterName:
          type: string
        approverId:
          type: string
        approverName:
          type: string
        approverIds:
          type: array
          items:
            type: string
        stepIndex:
          type: integer
        stepTotal:
          type: integer
        baseSeq:
          type: integer
          description: Version the pending change is based on.
        action:
          type: string
          enum:
          - edit
          - rollback
        state:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
        reason:
          type: string
        decisionComment:
          type: string
        payloadSha256:
          type: string
          description: SHA-256 of the staged pending content.
        payloadSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        rollbackTargetSeq:
          type: integer
      required:
      - id
      - fileId
      - fileName
      - requesterId
      - requesterName
      - approverId
      - approverName
      - baseSeq
      - action
      - state
      - createdAt
    Share:
      type: object
      properties:
        id:
          type: string
        recipientKind:
          type: string
          enum:
          - user
          - group
        recipientId:
          type: string
        recipientName:
