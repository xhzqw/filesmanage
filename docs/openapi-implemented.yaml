        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Rename a file
      operationId: renameFile
      tags:
      - Files
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: File id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFileRequest'
      responses:
        '200':
          description: Renamed file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/File'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
