components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: fm_session
      description: HttpOnly session cookie issued by POST /api/login.
    officeJWT:
      type: http
      scheme: bearer
      description: Document-server JWT presented by ONLYOFFICE on save callbacks.
    officeSourceToken:
      type: apiKey
      in: query
      name: token
      description: Per-session source token embedded in the editor document URL.
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable SPEC 5.3 error code.
            message:
              type: string
              description: Present only when FILESMANAGE_DEBUG_ERRORS=true.
          required:
          - code
      required:
      - ok
      - error
    SessionUser:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          description: True until the first forced password change completes.
      required:
      - id
      - displayName
      - isAdmin
      - mustChangePassword
    User:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        departmentId:
          type: string
        mustChangePassword:
          type: boolean
        disabled:
          type: boolean
      required:
      - id
      - login
      - displayName
      - isAdmin
      - departmentId
      - mustChangePassword
      - disabled
    Department:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
      required:
      - id
      - name
      - parentId
    Workgroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        departmentId:
          type: string
      required:
      - id
      - name
      - departmentId
    Folder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
      required:
      - id
      - name
      - parentId
    File:
      type: object
      properties:
        id:
          type: string
        folderId:
          type: string
        name:
          type: string
        uploadedBy:
          type: string
          description: Uploader display name.
        contentType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the committed content.
        updatedAt:
          type: string
          format: date-time
        currentVersionSeq:
          type: integer
          description: Absent when the file has no committed version.
      required:
      - id
      - folderId
      - name
      - uploadedBy
      - contentType
      - sizeBytes
      - sha256
      - updatedAt
    FileVersion:
      type: object
      properties:
        versionSeq:
          type: integer
          description: Monotonic per file; rollback appends a new version.
        sha256:
          type: string
        sizeBytes:
          type: integer
        action:
          type: string
          enum:
          - upload
          - save
          - rollback
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        baseSeq:
          type: integer
          description: Version this change was based on.
        rollbackTargetSeq:
          type: integer
          description: Present for rollback versions.
        rollbackFromSeq:
          type: integer
          description: Present for rollback versions.
        reason:
          type: string
      required:
      - versionSeq
      - sha256
      - sizeBytes
      - action
      - createdBy
      - createdAt
    FileMeta:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/File'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
      required:
      - file
      - versions
    FilePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
        nextCursor:
          type: string
          description: Opaque keyset cursor; empty when the page is the last one.
      required:
      - items
      - nextCursor
    Grant:
      type: object
      properties:
        id:
          type: string
        folderId:
          type: string
        subjectKind:
          type: string
          enum:
          - user
          - group
          - department
        subjectId:
          type: string
        actions:
          type: array
          items:
            type: string
            enum:
            - view
            - download
            - upload
            - edit
            - delete
            - share
            - manage
            - restore
            - purge
        scopeOnly:
          type: boolean
          description: When true the grant does not inherit into child folders.
        grantedBy:
          type: string
        grantedByName:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - folderId
      - subjectKind
      - subjectId
      - actions
      - scopeOnly
      - grantedBy
      - grantedByName
    TrashEntry:
      type: object
      properties:
        id:
          type: string
        oldName:
          type: string
        deletedBy:
          type: string
        deletedByName:
          type: string
        deletedAt:
          type: string
          format: date-time
        fileId:
          type: string
          description: Set for deleted files.
        folderId:
          type: string
          description: Set for deleted folders.
        oldParentId:
          type: string
          description: Original parent folder id.
        subtreeCount:
          type: integer
          description: Folders swept into the trash entry.
      required:
      - id
      - oldName
      - deletedBy
      - deletedByName
      - deletedAt
    Approval:
      type: object
      properties:
        id:
          type: string
        fileId:
          type: string
        fileName:
          type: string
        requesterId:
          type: string
        requesterName:
          type: string
        approverId:
          type: string
        approverName:
          type: string
        baseSeq:
          type: integer
          description: Version the pending change is based on.
        action:
          type: string
          enum:
          - edit
          - rollback
        state:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
        reason:
          type: string
        decisionComment:
          type: string
        payloadSha256:
          type: string
          description: SHA-256 of the staged pending content.
        payloadSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        rollbackTargetSeq:
          type: integer
      required:
      - id
      - fileId
      - fileName
      - requesterId
      - requesterName
      - approverId
      - approverName
      - baseSeq
      - action
      - state
      - createdAt
    Share:
      type: object
      properties:
        id:
          type: string
        recipientKind:
          type: string
          enum:
          - user
          - group
          - department
        recipientId:
          type: string
        recipientName:
          type: string
        actions:
          type: array
          items:
            type: string
            enum:
            - view
            - download
            - upload
            - edit
            - delete
            - share
            - manage
            - restore
            - purge
        includeDescendants:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        fileId:
          type: string
          description: Present for file shares.
        folderId:
          type: string
          description: Present for folder shares.
        resourceKind:
          type: string
          enum:
          - file
          - folder
        resourceName:
          type: string
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
      required:
      - id
      - recipientKind
      - recipientId
      - recipientName
      - actions
      - includeDescendants
      - createdBy
      - createdAt
      - revoked
    Favorite:
      type: object
      properties:
        id:
          type: string
        resourceName:
          type: string
        unavailable:
          type: boolean
          description: Resource was deleted; kept for stable ids.
        createdAt:
          type: string
          format: date-time
        fileId:
          type: string
          description: Present for file favorites.
        folderId:
          type: string
          description: Present for folder favorites.
        kind:
          type: string
          enum:
          - file
          - folder
      required:
      - id
      - resourceName
      - unavailable
      - createdAt
    Preview:
      type: object
      properties:
        fileId:
          type: string
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
        sha256:
          type: string
        textual:
          type: boolean
        truncated:
          type: boolean
          description: True when the preview window cut the content.
        content:
          type: string
          description: Decoded preview text; empty for binary files.
        byteMeta:
          $ref: '#/components/schemas/ByteMeta'
      required:
      - fileId
      - name
      - contentType
      - size
      - sha256
      - textual
      - truncated
      - content
      - byteMeta
    ByteMeta:
      type: object
      properties:
