          type: integer
        sha256:
          type: string
        encoding:
          type: string
        hasBom:
          type: boolean
        eol:
          type: string
          enum:
          - lf
          - crlf
          - cr
          - mixed
          - none
        endsWithNewline:
          type: boolean
        printable:
          type: boolean
        rawBase64:
          type: string
          description: Exact preview prefix bytes, base64, for byte-faithful editing.
      required:
      - size
      - sha256
      - encoding
      - hasBom
      - eol
      - endsWithNewline
      - printable
