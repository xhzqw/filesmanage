openapi: 3.0.3
info:
  title: filesmanage v2.1 implemented API
  version: 2.1.0
  description: "Contract for the implemented filesmanage v2.1 HTTP surface, generated by\nscripts/gen_openapi.py from internal/httpx/router.go\
    \ and the handler payload\nbuilders. Served only from the isolated target host on 127.0.0.1:18091.\n\nConventions:\n-\
    \ Success responses are `{\"ok\": true, \"data\": ...}`; failures are\n  `{\"ok\": false, \"error\": {\"code\": \"E_...\"\
    }}` with stable SPEC 5.3 codes.\n- Authentication is the HttpOnly `fm_session` cookie (SameSite=Strict).\n- Mutating requests\
    \ require an Origin header matching the Host when sent by a\n  browser (E_ORIGIN otherwise).\n- `mustChangePassword` sessions\
    \ may only call /api/login, /api/me,\n  /api/me/password and /api/logout; every other business route answers 403\n  E_PASSWORD_CHANGE_REQUIRED.\n\
    - Admin-only capability (user/department/workgroup management) is enforced in\n  the application layer and answers 403\
    \ E_FORBIDDEN for non-admins.\n- Socket peers outside FILESMANAGE_LAN_ALLOW_CIDRS are refused with 403\n  E_NETWORK before\
    \ routing."
servers:
- url: http://127.0.0.1:18091
  description: Isolated development instance (target host)
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /health/ready:
    get:
      summary: Readiness probe (PostgreSQL reachable)
      operationId: healthReady
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/login:
    post:
      summary: Authenticate and open a session
      operationId: login
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set (HttpOnly, SameSite=Strict).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session (E_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: Session revoked and cookie cleared
  /api/me/password:
    post:
      summary: Change own password (forced on first login)
      operationId: changePassword
      tags:
      - Auth
      security:
      - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed; old password immediately invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: E_PASSWORD_POLICY — password does not satisfy the policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me:
    get:
      summary: Current session user
      operationId: currentUser
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/tree:
    get:
      summary: Authorized folder tree
      operationId: folderTree
      tags:
      - Folders
      security:
      - cookieSession: []
      responses:
        '200':
          description: Folders the caller may see, with parent links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: Rejected with 403 E_PASSWORD_CHANGE_REQUIRED until the forced first-login password change completes.
  /api/folders:
    post:
      summary: Create a folder
      operationId: createFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/{id}:
    patch:
      summary: Rename a folder
      operationId: renameFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFolderRequest'
      responses:
        '200':
          description: Renamed folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Delete a folder subtree into the trash
      operationId: deleteFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      responses:
        '200':
          description: Trash entry covering the subtree.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      trashId:
                        type: string
                      folders:
                        type: integer
                        description: Folders swept into this trash entry.
                      oldName:
                        type: string
                    required:
                    - trashId
                    - folders
                    - oldName
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN / E_PASSWORD_CHANGE_REQUIRED — authorization denied or first-login password change pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/{id}/move:
    post:
      summary: Move a folder to another parent
