openapi: 3.0.3
info:
  title: filesmanage v2.1 implemented API
  version: 2.1.0
  description: "Contract for the implemented filesmanage v2.1 HTTP surface, generated by\nscripts/gen_openapi.py from internal/httpx/router.go\
    \ and the handler payload\nbuilders. Served only from the isolated target host on 127.0.0.1:18091.\n\nConventions:\n-\
    \ Success responses are `{\"ok\": true, \"data\": ...}`; failures are\n  `{\"ok\": false, \"error\": {\"code\": \"E_...\"\
    }}` with stable SPEC 5.3 codes.\n- Authentication is the HttpOnly `fm_session` cookie (SameSite=Strict).\n- Mutating requests\
    \ require an Origin header matching the Host when sent by a\n  browser (E_ORIGIN otherwise).\n- Issued account credentials\
    \ can be used at first login; changing passwords\n  remains available but is not mandatory.\n- Admin-only capability (user/department/workgroup\
    \ management) is enforced in\n  the application layer and answers 403 E_FORBIDDEN for non-admins.\n- Socket peers outside\
    \ FILESMANAGE_LAN_ALLOW_CIDRS are refused with 403\n  E_NETWORK before routing."
servers:
- url: http://127.0.0.1:18091
  description: Isolated development instance (target host)
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /health/ready:
    get:
      summary: Readiness probe (PostgreSQL reachable)
      operationId: healthReady
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/login:
    post:
      summary: Authenticate and open a session
      operationId: login
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set (HttpOnly, SameSite=Strict).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session (E_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: Session revoked and cookie cleared
  /api/me/password:
    post:
      summary: Change own password (forced on first login)
      operationId: changePassword
      tags:
      - Auth
      security:
      - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed; old password immediately invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: E_PASSWORD_POLICY — password does not satisfy the policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me:
    get:
      summary: Current session user
      operationId: currentUser
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SessionUser'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me/sessions:
    get:
      summary: List own active login devices
      operationId: listOwnSessions
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: At most 50 own sessions; includes current marker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: 96-bit prefix of session-token SHA-256; selector only, not a bearer token.
                        device:
                          type: string
                          description: Coarse browser and operating-system label.
                        address:
                          type: string
                          description: Authenticated socket client IP or trusted Nginx-forwarded IP.
                        createdAt:
                          type: string
                          format: date-time
                        lastSeenAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        current:
                          type: boolean
                      required:
                      - id
                      - device
                      - address
                      - createdAt
                      - lastSeenAt
                      - expiresAt
                      - current
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me/auth-activity:
    get:
      summary: List own recent account security actions
      operationId: listOwnAuthActivity
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: At most 30 own login/logout/revoke audit records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: auth.login, auth.logout, auth.session_revoke or auth.sessions_revoke
                        outcome:
                          type: string
                          description: success or denied
                        device:
                          type: string
                        address:
                          type: string
                        count:
                          type: integer
                        occurredAt:
                          type: string
                          format: date-time
                      required:
                      - type
                      - outcome
                      - device
                      - address
                      - occurredAt
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me/sessions/others:
    delete:
      summary: Revoke every other active session
      operationId: revokeOtherSessions
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '200':
          description: Number of other sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      revoked:
                        type: integer
                    required:
                    - revoked
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/me/sessions/{id}:
    delete:
      summary: Revoke a single other session belonging to the caller
      operationId: revokeOwnSession
      tags:
      - Auth
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: 24 lowercase hexadecimal characters, never a bearer token.
        schema:
          type: string
      responses:
        '200':
          description: Other session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                    required:
                    - revoked
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: ' Foreign-account IDs and missing IDs are indistinguishable (404). Current session cannot be revoked here.'
  /api/events/ws:
    get:
      summary: Subscribe to live session events (WebSocket)
      operationId: sessionEventsWebSocket
      tags:
      - Auth
      security:
      - cookieSession: []
      responses:
        '101':
          description: 'Switching Protocols: WebSocket JSON events (connection.ready, connection.heartbeat, session.changed,
            session.revoked, server.unavailable).'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_ORIGIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '426':
          description: E_UPGRADE_REQUIRED — WebSocket Upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: E_LIVE_CAPACITY — live connection limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: Origin must match Host, scheme and port; uses HttpOnly cookie, no URL token. Browser clients connect via
        ws:// on HTTP or wss:// on HTTPS. Up to 512 live connections per server process and 6-second heartbeat. Server-to-client
        JSON messages only; each event revalidates the session. Existing HTTP APIs remain authoritative.
  /api/folders/tree:
    get:
      summary: Authorized folder tree
      operationId: folderTree
      tags:
      - Folders
      security:
      - cookieSession: []
      responses:
        '200':
          description: Folders the caller may see, with parent links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/children:
    get:
      summary: List one page of a folder's visible children (keyset pagination)
      operationId: folderChildren
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: parentId
        in: query
        required: false
        description: Parent folder id; empty or absent lists the caller's visible roots, including a pruned subtree whose
          parent is not visible.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size; defaults to 50 and is capped at 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor from nextCursor over the (name,id) sort key.
        schema:
          type: string
      responses:
        '200':
          description: Authorized page, name-ordered. A parent the caller may not list answers exactly like a missing one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/FolderChildrenPage'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND — the parent is missing, trashed, or not listable by the caller (indistinguishable on purpose)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/search:
    get:
      summary: Search visible folders by name (keyset pagination)
      operationId: searchFolders
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: q
        in: query
        required: true
        description: Folder name fragment; required and non-blank (400 E_BAD otherwise).
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size; defaults to 50 and is capped at 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor from nextCursor over the (name,id) sort key.
        schema:
          type: string
      responses:
        '200':
          description: Authorized matches, each with its visible path truncated at a hidden ancestor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/FolderSearchPage'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/{id}:
    get:
      summary: Resolve one listable folder by id for deep links beyond the tree hint
      operationId: folderDetail
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Exact folder id, including results outside the compatibility tree.
        schema:
          type: string
      responses:
        '200':
          description: Selected folder; missing, deleted and hidden ids are indistinguishable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND — missing, deleted or unlistable folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Rename a folder
      operationId: renameFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFolderRequest'
      responses:
        '200':
          description: Renamed folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Delete a folder subtree into the trash
      operationId: deleteFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      responses:
        '200':
          description: Trash entry covering the subtree.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      trashId:
                        type: string
                      folders:
                        type: integer
                        description: Folders swept into this trash entry.
                      oldName:
                        type: string
                    required:
                    - trashId
                    - folders
                    - oldName
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders:
    post:
      summary: Create a folder
      operationId: createFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/{id}/move:
    post:
      summary: Move a folder to another parent
      operationId: moveFolder
      tags:
      - Folders
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFolderRequest'
      responses:
        '200':
          description: Moved folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Folder'
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/folders/{id}/acls:
    get:
      summary: List grants on a folder
      operationId: listGrants
      tags:
      - Grants
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Folder id.
        schema:
          type: string
      responses:
        '200':
          description: Grants on the folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grant'
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
