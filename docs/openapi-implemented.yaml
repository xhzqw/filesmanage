openapi: 3.0.3
info:
  title: filesmanage v2.1 implemented API
  version: 2.1.0
  description: "Contract for the implemented filesmanage v2.1 HTTP surface, generated by\nscripts/gen_openapi.py from internal/httpx/router.go\
    \ and the handler payload\nbuilders. Served only from the isolated target host on 127.0.0.1:18091.\n\nConventions:\n-\
    \ Success responses are `{\"ok\": true, \"data\": ...}`; failures are\n  `{\"ok\": false, \"error\": {\"code\": \"E_...\"\
    }}` with stable SPEC 5.3 codes.\n- Authentication is the HttpOnly `fm_session` cookie (SameSite=Strict).\n- Mutating requests\
    \ require an Origin header matching the Host when sent by a\n  browser (E_ORIGIN otherwise).\n- Issued account credentials\
    \ can be used at first login; changing passwords\n  remains available but is not mandatory.\n- Admin-only capability (user/department/workgroup\
    \ management) is enforced in\n  the application layer and answers 403 E_FORBIDDEN for non-admins.\n- Socket peers outside\
    \ FILESMANAGE_LAN_ALLOW_CIDRS are refused with 403\n  E_NETWORK before routing."
servers:
- url: http://127.0.0.1:18091
  description: Isolated development instance (target host)
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /health/ready:
    get:
      summary: Readiness probe (PostgreSQL reachable)
      operationId: healthReady
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '503':
          description: E_DEPENDENCY — database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/tasks:
    post:
      summary: Create single-file root work task (administrator only)
      operationId: cdwCreateRoot
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 8-128 ASCII letters, digits, hyphens or underscores; same key+body exactly replays the committed result.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                fileId:
                  type: string
                templateVersionId:
                  type: string
                  description: Optional; built-in single-file task template when omitted.
                assignee:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - user
                      - workgroup
                    id:
                      type: string
                  required:
                  - kind
                  - id
                allowOverrideReview:
                  type: boolean
                  description: Administrator opt-in creates published single-file template version allowing gate-specific
                    override; defaults false.
              required:
              - title
              - fileId
              - assignee
      responses:
        '201':
          description: Created with rev-1 ETag
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                      parentTaskId:
                        type: string
                      parentRevision:
                        type: integer
                        minimum: 1
                      state:
                        type: string
                      revision:
                        type: integer
                        minimum: 1
                      assignmentId:
                        type: string
                      actualAcceptorId:
                        type: string
                      remainingObligations:
                        type: array
                        items:
                          type: string
                    required:
                    - taskId
                    - state
                    - revision
                    - assignmentId
                required:
                - ok
                - data
        '400':
          description: Invalid input or missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/inbox:
    get:
      summary: Authorized CDW task and accountability inbox
      operationId: cdwInbox
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Requested rows (1..100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Authorized current rows; nextCursor null until cursor paging is implemented.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - task
                              - obligation
                            taskId:
                              type: string
                            title:
                              type: string
                            fileId:
                              type: string
                            state:
                              type: string
                            revision:
                              type: integer
                              minimum: 1
                            assignmentId:
                              type: string
                            obligationId:
                              type: string
                            obligationKind:
                              type: string
                      asOf:
                        type: string
                        format: date-time
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                    - items
                    - asOf
                    - nextCursor
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/initiated:
    get:
      summary: Track work actually started by this user, including delegated and ended tasks
      operationId: cdwInitiated
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Requested raw rows (1..100). Defaults to 30.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        description: Opaque task ID from previous page; scoped to the current creator.
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Author-scoped keyset page, further filtered by current file preview ACL; the number of visible items
            may be lower than the raw page size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            taskId:
                              type: string
                            rootId:
                              type: string
                            parentId:
                              type: string
                            title:
                              type: string
                            fileId:
                              type: string
                            state:
                              type: string
                            revision:
                              type: integer
                              minimum: 1
                            createdAt:
                              type: string
                              format: date-time
                            assigneeName:
                              type: string
                          required:
                          - taskId
                          - rootId
                          - title
                          - fileId
                          - state
                          - revision
                          - createdAt
                      nextCursor:
                        type: string
                        description: Opaque creator-scoped task cursor; absent on the last page.
                    required:
                    - items
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/initiated/{id}/events:
    get:
      summary: Immutable task, branch, review and responsibility facts for the current creator
      operationId: cdwInitiatedEvents
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Author-owned work ID.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Requested event rows (1..100). Defaults to 30.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: before
        in: query
        required: false
        description: Earlier event ID cursor, positive integer.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Immutable audit identifiers, event kind, actor name and exact time without exposing raw event payloads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 1
                            kind:
                              type: string
                            evidenceRef:
                              type: string
                            event:
                              type: string
                            actorName:
                              type: string
                            occurredAt:
                              type: string
                              format: date-time
                          required:
                          - id
                          - kind
                          - evidenceRef
                          - event
                          - actorName
                          - occurredAt
                      nextBefore:
                        type: integer
                        minimum: 1
                    required:
                    - items
                required:
                - ok
                - data
        '400':
          description: E_BAD — malformed request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/initiated/{id}/flow:
    get:
      summary: Creator-scoped delegation subtree and exact-delivery controlled-document milestone evidence
      operationId: cdwInitiatedFlow
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task authored by the signed-in user.
        schema:
          type: string
      responses:
        '200':
          description: Live readonly facts. Missing milestones never imply completion. Release and receipt evidence is linked
            through exact frozen delivery and artifact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                      rootId:
                        type: string
                      truncated:
                        type: boolean
                      works:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            parentId:
                              type: string
                            title:
                              type: string
                            state:
                              type: string
                            round:
                              type: integer
                              minimum: 1
                            responsibleName:
                              type: string
                            createdByName:
                              type: string
                          required:
                          - id
                          - title
                          - state
                          - round
                          - createdByName
                      milestones:
                        type: array
                        items:
                          type: object
                          properties:
                            taskId:
                              type: string
                            kind:
                              type: string
                            reference:
                              type: string
                            state:
                              type: string
                            round:
                              type: integer
                              minimum: 1
                            actorName:
                              type: string
                            recordedAt:
                              type: string
                              format: date-time
                            detail:
                              type: string
                          required:
                          - taskId
                          - kind
                          - reference
                          - state
                          - recordedAt
                    required:
                    - taskId
                    - rootId
                    - truncated
                    - works
                    - milestones
                required:
                - ok
                - data
        '401':
          description: E_AUTH — missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: E_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/tasks/{id}/accept:
    post:
      summary: Accept a task as its active assignee or current workgroup leader
      operationId: cdwAccept
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task ID.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: 8-128 ASCII letters, digits, hyphens or underscores; same key+body exactly replays the committed result.
        schema:
          type: string
          maxLength: 128
      - name: If-Match
        in: header
        required: true
        description: Strong ETag rev-N enclosed in double quotes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Accepted with new strong ETag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                      parentTaskId:
                        type: string
                      parentRevision:
                        type: integer
                        minimum: 1
                      state:
                        type: string
                      revision:
                        type: integer
                        minimum: 1
                      assignmentId:
                        type: string
                      actualAcceptorId:
                        type: string
                      remainingObligations:
                        type: array
                        items:
                          type: string
                    required:
                    - taskId
                    - state
                    - revision
                    - assignmentId
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/tasks/{id}/delegate:
    post:
      summary: Create child task retaining parent accountability
      operationId: cdwDelegate
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Parent task ID.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: 8-128 ASCII letters, digits, hyphens or underscores; same key+body exactly replays the committed result.
        schema:
          type: string
          maxLength: 128
      - name: If-Match
        in: header
        required: true
        description: Strong ETag rev-N enclosed in double quotes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                childTitle:
                  type: string
                  maxLength: 255
                assignee:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - user
                      - workgroup
                    id:
                      type: string
                  required:
                  - kind
                  - id
              required:
              - childTitle
              - assignee
      responses:
        '201':
          description: Child assigned; parent obligations stay pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                      parentTaskId:
                        type: string
                      parentRevision:
                        type: integer
                        minimum: 1
                      state:
                        type: string
                      revision:
                        type: integer
                        minimum: 1
                      assignmentId:
                        type: string
                      actualAcceptorId:
                        type: string
                      remainingObligations:
                        type: array
                        items:
                          type: string
                    required:
                    - taskId
                    - state
                    - revision
                    - assignmentId
                required:
                - ok
                - data
        '403':
          description: Not the accepted active assignee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/work-branches:
    post:
      summary: Create isolated task editing branch; no file_versions mutation
      operationId: cdwCreateBranch
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 8-128 ASCII letters, digits, hyphens or underscores; same key+body exactly replays the committed result.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
              required:
              - taskId
      responses:
        '200':
          description: New branch created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      branchId:
                        type: string
                      taskId:
                        type: string
                      fileId:
                        type: string
                      baseVersionId:
                        type: string
                      baseSha256:
                        type: string
                      state:
                        type: string
                      revision:
                        type: integer
                        minimum: 1
                      headRevisionId:
                        type: string
                      editEpoch:
                        type: integer
                        minimum: 1
                    required:
                    - branchId
                    - taskId
                    - fileId
                    - baseVersionId
                    - baseSha256
                    - state
                    - revision
                    - editEpoch
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/work-branches/{id}:
    get:
      summary: Current authorized work branch
      operationId: cdwReadBranch
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Branch ID.
        schema:
          type: string
      responses:
        '200':
          description: Live branch head and edit epoch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      branchId:
                        type: string
                      taskId:
                        type: string
                      fileId:
                        type: string
                      baseVersionId:
                        type: string
                      baseSha256:
                        type: string
                      state:
                        type: string
                      revision:
                        type: integer
                        minimum: 1
                      headRevisionId:
                        type: string
                      editEpoch:
                        type: integer
                        minimum: 1
                    required:
                    - branchId
                    - taskId
                    - fileId
                    - baseVersionId
                    - baseSha256
                    - state
                    - revision
                    - editEpoch
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workbench/tasks/{id}/branches:
    get:
      summary: Authorized task branches
      operationId: cdwTaskBranches
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task ID.
        schema:
          type: string
      responses:
        '200':
          description: Branches visible to accepted assignee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            branchId:
                              type: string
                            taskId:
                              type: string
                            fileId:
                              type: string
                            baseVersionId:
                              type: string
                            baseSha256:
                              type: string
                            state:
                              type: string
                            revision:
                              type: integer
                              minimum: 1
                            headRevisionId:
                              type: string
                            editEpoch:
                              type: integer
                              minimum: 1
                          required:
                          - branchId
                          - taskId
                          - fileId
                          - baseVersionId
                          - baseSha256
                          - state
                          - revision
                          - editEpoch
                    required:
                    - items
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/work-branches/{id}/office-sessions:
    post:
      summary: Open exclusive ONLYOFFICE document key for a task branch
      operationId: cdwBranchOffice
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Branch ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: ONLYOFFICE editor config signed; callback/source use branch-only routes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      branch:
                        type: object
                        properties:
                          branchId:
                            type: string
                          taskId:
                            type: string
                          fileId:
                            type: string
                          baseVersionId:
                            type: string
                          baseSha256:
                            type: string
                          state:
                            type: string
                          revision:
                            type: integer
                            minimum: 1
                          headRevisionId:
                            type: string
                          editEpoch:
                            type: integer
                            minimum: 1
                        required:
                        - branchId
                        - taskId
                        - fileId
                        - baseVersionId
                        - baseSha256
                        - state
                        - revision
                        - editEpoch
                      session:
                        type: object
                      editorUrl:
                        type: string
                      config:
                        type: object
                required:
                - ok
                - data
        '409':
          description: Conflict — E_NAME_CONFLICT, E_VERSION_CONFLICT, E_LOCKED, E_APPROVAL_PENDING or E_PARENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/work-branches/{id}/office-sessions/{sessionId}/heartbeat:
    post:
      summary: Renew the live exclusively owned branch editor lease
      operationId: cdwHeartbeatBranchOffice
      tags:
      - CDW
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        description: Branch ID.
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        description: Owned active Office session ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Active lease extended, expired/fenced leases cannot revive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      branchId:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                    - sessionId
                    - branchId
                    - expiresAt
                required:
                - ok
                - data
        '403':
          description: E_FORBIDDEN — authorization denied
